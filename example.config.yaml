# Phase4 configuration file.
#
# Copy this file and pass its path via --config (e.g. --config digitone.yaml),
# or name it config.yaml in the directory from which you run phase4 to have it
# picked up automatically.
# Any key may be omitted; absent keys inherit the hardcoded application default.
# Unknown keys are rejected so misspelled settings cannot be silently ignored.
# CLI flags always take priority over values set here.
#
# Default values are shown in each comment.

network:
  # WebSocket JSON listen address. Phase4 binds this address and clients
  # connect in. Loopback-only. Omit to disable the WebSocket output.
  # A commonly used value is 127.0.0.1:8889.
  # default: (disabled)
  # ws_addr: "127.0.0.1:8889"

  # Maximum number of concurrent WebSocket clients. Must be at least 1 and
  # fit the runtime semaphore capacity. Only meaningful when ws_addr is set.
  # default: 8
  max_clients: 8

  # OSC UDP target IP address and port. Phase4 sends to this address, it does not listen.
  # Omit to disable the OSC output.
  # Bundles all 32 bins per analysed channel into one UDP datagram per frame.
  # Addresses follow /phase4/ch/{n}/bin/{n}. Envelope floats are unnormalised
  # and can exceed 1.0. MIDI messages, when enabled, are sent separately.
  # default: (disabled)
  # osc_addr: "127.0.0.1:7000"

  # --no-browser-origin stays CLI-only and is never read from this file. It is
  # a presence-style flag with no "explicitly off" form, so offering it here
  # would break the rule that a CLI flag always overrides a file value.

audio:
  # Partial or full name of the audio input device to use.
  # Exact matches are preferred; substring matches are used as a fallback.
  # default: (none, required unless running in calibration mode)
  # device_name_match: "Duet 3"

  # Zero-based hardware channel indices forwarded to the analyser.
  # Sorted and deduplicated. Outputs are indexed from zero in that order.
  # Omit to forward all channels. Calibration ignores a non-empty selection.
  # default: (all channels)
  # analyse_channels: [0, 1]

midi:
  # Partial or full name of the MIDI input device to use.
  # Exact matches are preferred; substring matches are used as a fallback.
  # --test-midi-clock overrides this setting and stays CLI-only.
  # default: (none, MIDI input disabled unless set here or via --midi-device)
  # device_name_match: "Loopback"

vocoder:
  # Envelope follower attack time constant in milliseconds.
  # Smaller values react faster to transients.
  # default: 24.0
  attack_ms: 24.0

  # Envelope follower release time constant in milliseconds.
  # Smaller values decay faster after a transient.
  # default: 96.0
  release_ms: 96.0

  # Lowest filter bank centre frequency in Hz.
  # default: 60.0
  freq_low: 60.0

  # Highest filter bank centre frequency in Hz.
  # Must be at or below 45 percent of the resolved input sample rate.
  # default: 6000.0
  freq_high: 6000.0

  # Bandpass filter Q factor. All bands must have finite, stable f32
  # coefficients at the resolved sample rate. Higher Q narrows bands
  # and increases their gain.
  # default: 8.0
  filter_q: 8.0
